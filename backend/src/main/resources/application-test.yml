spring:
  config:
    activate:
      on-profile: test

jwt:
  secret: test-secret-key-with-at-least-thirty-two-bytes

google:
  server-client-id: test-google-server-client-id

transit:
  boarding:
    tago-experiment-enabled: false
  monitoring:
    enabled: false
  client:
    connect-timeout: PT2S
    response-timeout: PT5S
    metadata-response-timeout: PT30S
    tago:
      base-url: https://example.test/tago
      metadata-base-url: https://example.test/tago-metadata
      service-key: test-tago-service-key
    seoul:
      service-key: test-seoul-service-key

# Keep automatic external work and Apple credential configuration isolated in tests.
notification:
  dispatch:
    enabled: false
  fcm:
    enabled: false

apple:
  authentication:
    enabled: false
  notifications:
    enabled: false
    worker-enabled: false

account:
  deletion:
    recovery-enabled: false
