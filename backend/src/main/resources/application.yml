spring:
  application:
    name: stopbell-backend
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

jwt:
  secret: ${JWT_SECRET}
  issuer: stopbell
  access-token-expiration: PT1H

google:
  server-client-id: ${GOOGLE_SERVER_CLIENT_ID}

notification:
  fcm:
    enabled: ${FCM_ENABLED:false}
    project-id: ${FCM_PROJECT_ID:}
    credential-path: ${GOOGLE_APPLICATION_CREDENTIALS:}
    # Development transport candidates; final dispatch/retry policy belongs to TASK-709.
    connect-timeout: PT2S
    read-timeout: PT5S
    request-budget: PT15S

transit:
  monitoring:
    enabled: false
    fixed-delay: PT20S
    failure-retry-delay: PT5S
  client:
    connect-timeout: PT2S
    response-timeout: PT5S
    metadata-response-timeout: PT30S
    tago:
      base-url: ${TAGO_BASE_URL:https://apis.data.go.kr/1613000/BusLcInfoInqireService}
      metadata-base-url: ${TAGO_METADATA_BASE_URL:https://apis.data.go.kr/1613000/BusRouteInfoInqireService}
      service-key: ${PUBLIC_DATA_SERVICE_KEY}
    seoul:
      base-url: ${SEOUL_BUS_BASE_URL:http://ws.bus.go.kr/api/rest/buspos}
      service-key: ${PUBLIC_DATA_SERVICE_KEY}

management:
  endpoint:
    health:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health

# MySQL duplicate-key messages contain the raw installation ID or FID.
# DeviceController reports unexpected persistence failures without the JDBC cause.
logging:
  level:
    org.hibernate.orm.jdbc.error: "OFF"
    # HTTP debug/wire logs can include bearer tokens, FIDs and credential assertions.
    com.google.api.client.http: "OFF"
    org.apache.http: "OFF"
