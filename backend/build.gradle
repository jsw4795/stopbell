plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.stopbell'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'com.google.api-client:google-api-client:2.9.0'
    implementation 'org.springframework.boot:spring-boot-flyway'
    implementation 'org.flywaydb:flyway-mysql'

    runtimeOnly 'com.mysql:mysql-connector-j'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-mysql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    // The JDK snapshots retry settings when its HTTP implementation initializes.
    systemProperty 'jdk.httpclient.redirects.retrylimit', '1'
    systemProperty 'jdk.httpclient.disableRetryConnect', 'true'
    systemProperty 'task811.test.classpath', sourceSets.test.runtimeClasspath.asPath
    // Shared schemas and singleton state are deliberately confined to one sequential worker.
    maxParallelForks = 1
    systemProperty 'junit.jupiter.execution.parallel.enabled', 'false'
    ['junit.jupiter.testclass.order.default', 'junit.jupiter.testmethod.order.default',
     'junit.jupiter.execution.order.random.seed'].each { key ->
        if (providers.gradleProperty(key).isPresent()) {
            systemProperty key, providers.gradleProperty(key).get()
        }
    }
    afterSuite { descriptor, result ->
        if (descriptor.parent == null) {
            logger.lifecycle("${name}: executed=${result.testCount}, passed=${result.successfulTestCount}, "
                    + "failed=${result.failedTestCount}, skipped=${result.skippedTestCount}")
        }
    }
}

// test/build remain the complete verification path. CI selects ciTest only after a safe diff.
['ciTest', 'migrationTest', 'fastTest', 'dbTest'].each { taskName ->
    tasks.register(taskName, Test) {
        group = 'verification'
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        if (taskName == 'ciTest') {
            // Each worker JVM owns its own MySQL server and runs its classes sequentially.
            maxParallelForks = (providers.gradleProperty('ciTestForks').getOrElse('2')) as int
        }
        useJUnitPlatform {
            if (taskName == 'migrationTest') {
                includeTags 'migration'
            } else {
                // Child-JVM restart probes take tens of seconds; only test/build run them.
                excludeTags 'migration', 'process-restart'
                if (taskName == 'fastTest') excludeTags 'db'
                if (taskName == 'dbTest') includeTags 'db'
            }
        }
    }
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('bootJar') {
    archiveFileName = 'stopbell.jar'
}

// Explicit, database-independent one-shot entry point; never starts the Spring application.
tasks.register('collectTransitMetadata', JavaExec) {
    group = 'application'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.stopbell.transit.metadata.TransitMetadataCollectionCli'
    jvmArgs '-Djdk.httpclient.redirects.retrylimit=1', '-Djdk.httpclient.disableRetryConnect=true'
    standardInput = System.in
}
