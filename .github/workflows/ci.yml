name: CI

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify Backend CI selection
        working-directory: ${{ github.workspace }}
        run: python3 -m unittest discover -s tools/tests -p 'test_backend_test_ci.py'
      - name: Select Backend verification scope
        id: suite
        working-directory: ${{ github.workspace }}
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            python3 tools/backend_test_ci.py select --manual
          else
            python3 tools/backend_test_ci.py select --base "$CHANGE_BASE"
          fi
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
      - name: Verify Docker is available for Testcontainers
        run: docker info
      - name: Build and run tests
        env:
          TEST_SUITE: ${{ steps.suite.outputs.suite }}
        run: |
          case "$TEST_SUITE" in
            full) ./gradlew --no-daemon build ;;
            regular) ./gradlew --no-daemon assemble ciTest ;;
            fast) ./gradlew --no-daemon assemble fastTest ;;
            *) echo 'Unknown Backend test scope'; exit 1 ;;
          esac
      - name: Report executed and excluded Backend tests
        if: always() && steps.suite.outputs.suite != ''
        env:
          TEST_SUITE: ${{ steps.suite.outputs.suite }}
        run: |
          case "$TEST_SUITE" in
            full) results=build/test-results/test ;;
            regular) results=build/test-results/ciTest ;;
            *) results=build/test-results/fastTest ;;
          esac
          python3 ../tools/backend_test_ci.py report --suite "$TEST_SUITE" --results "$results"

  flutter:
    name: Flutter analysis and tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Flutter 3.47.1
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        if: matrix.shard == 0
        run: flutter analyze --no-pub
      - name: Test
        run: flutter test --no-pub --total-shards 2 --shard-index ${{ matrix.shard }}
